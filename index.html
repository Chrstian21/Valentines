<!DOCTYPE html>
<html>
<head>
    <title>Be My Valentine? 💕</title>
    <style>
        body {
            text-align: center;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #ffdde1, #ee9ca7);
            color: #b30059;
            margin-top: 100px;
            overflow: hidden;
        }

        h1 {
            font-size: 48px;
        }

        p {
            font-size: 22px;
        }

        button {
            padding: 15px 35px;
            font-size: 20px;
            margin: 20px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        #yesBtn {
            background-color: #ff4d88;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 136, 0.4);
        }

        #yesBtn:hover {
            background-color: #ff1a66;
            transform: scale(1.1);
        }

        #noBtn {
            background-color: #ffc0cb;
            color: #b30059;
            position: relative;
        }

        #message {
            margin-top: 30px;
            font-size: 28px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Background Music -->
    <audio id="bgMusic" autoplay loop>
        <source src="love.mp3" type="audio/mpeg">
    </audio>

    <h1>💖 Will You Be My Valentine? 💖</h1>
    <p>You make my world softer and brighter 🌸</p>
    <p>Can I take you on a special Valentine’s date?</p>

    <button id="yesBtn" onclick="sayYes()">YES 💕</button>
    <button id="noBtn" onmouseover="moveButton()">No 🥺</button>

    <div id="message"></div>

    <script>
        document.addEventListener("click", function() {
            document.getElementById("bgMusic").play();
        });

        function sayYes() {
            document.getElementById("message").innerHTML =
                "YAYYY 💞 I promise it’ll be the sweetest date ever 🌹✨";
        }

        function moveButton() {
            var button = document.getElementById("noBtn");
            button.style.position = "absolute";
            button.style.left = Math.random() * 80 + "%";
            button.style.top = Math.random() * 80 + "%";
        }
    </script>

</body>
</html>
