<!DOCTYPE html>
<html>
<head>
    <title>Be My Valentine? 💕</title>
    <style>
        body {
            text-align: center;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #ffdde1, #ee9ca7);
            color: #b30059;
            margin-top: 100px;
            overflow: hidden;
        }

        h1 {
            font-size: 48px;
        }

        p {
            font-size: 22px;
        }

        button {
            padding: 15px 35px;
            font-size: 20px;
            margin: 20px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        #yesBtn {
            background-color: #ff4d88;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 136, 0.4);
        }

        #yesBtn:hover {
            background-color: #ff1a66;
            transform: scale(1.1);
        }

        #noBtn {
            background-color: #ffc0cb;
            color: #b30059;
            position: relative;
        }

        /* POPUP STYLE */
        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 182, 193, 0.7);
            justify-content: center;
            align-items: center;
        }

        .popup-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: #ff4d88;
            font-size: 24px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            animation: pop 0.4s ease;
        }

        @keyframes pop {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background: #ff4d88;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>💖 Will You Be My Valentine? 💖</h1>
    <p>You make my world softer and brighter 🌸</p>
    <p>Can I take you on a special Valentine’s date?</p>

    <button id="yesBtn" onclick="showPopup()">YES 💕</button>
    <button id="noBtn" onmouseover="moveButton()">No 🥺</button>

    <!-- POPUP -->
    <div class="popup" id="lovePopup">
        <div class="popup-content">
            💞 YAYYYY!!! 💞 <br><br>
            I’m so excited for our Valentine’s date 🌹✨ <br>
            I promise it’ll be sweet, special, and unforgettable 💕
            <br><br>
            <button class="close-btn" onclick="closePopup()">Close 💌</button>
        </div>
    </div>

    <script>
        function showPopup() {
            document.getElementById("lovePopup").style.display = "flex";
        }

        function closePopup() {
            document.getElementById("lovePopup").style.display = "none";
        }

        function moveButton() {
            var button = document.getElementById("noBtn");
            button.style.position = "absolute";
            button.style.left = Math.random() * 80 + "%";
            button.style.top = Math.random() * 80 + "%";
        }
    </script>

</body>
</html>
